# Render blueprint — deploy with "New → Blueprint" and pick this repo.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: aurora-cloud-relay
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: AUTH_TOKEN
        sync: false
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: RELAY_NAME
        value: Aurora Cloud Relay
      - key: KEEP_ALIVE_URL
        value: https://aurora-cloud-relay.onrender.com
